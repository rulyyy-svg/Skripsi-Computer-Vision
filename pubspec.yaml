name: flutter_application_1
description: "Computer Vision in Your Hand"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Gunakan range agar lebih stabil

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  camera: ^0.11.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  image_picker: ^1.0.7
  firebase_storage: ^12.1.1
  url_launcher: ^6.3.2
  flutter_tflite: ^1.0.1
  flutter_image_compress: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.11.0

# TARUH DI SINI, HANYA SATU SAJA
dependency_overrides:
  image_picker: ^1.0.7
  image: ^3.2.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_parfum.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_parfum.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/model.tflite
    - assets/models/labels.txt